<div style="display:flex; gap:40px; align-items:flex-start;">

  <!-- Left: fixed complementarity plot -->
  <div style="flex:1; min-width:0;">
    <div id="plot-fixed" style="width:100%; height:350px;"></div>
  </div>

  <!-- Right: slider + relaxed curve -->
  <div style="flex:1; min-width:0;">
    <label for="k-slider"><strong>κ:</strong></label>
    <input type="range" id="k-slider" min="0.01" max="0.25" value="0.25" step="0.0001" style="width:200px;">
    <span id="k-value">0.25</span>
    <div id="plot" style="width:100%; height:350px;"></div>
  </div>

</div>
<script>
document.addEventListener("DOMContentLoaded", function() {

  const layout = {
    margin: { t: 30 },
    xaxis: { title: 'x', range: [0.0, 1.1] },
    yaxis: { title: 'y', range: [0.0, 1.1] }
  };

  // Fixed plot: xy = 0, x>=0, y>=0 (the two rays along the axes)
  // Combine into a single trace with a gap using null
  Plotly.newPlot('plot-fixed', [
    { x: [0, 1.1, null, 0, 0], y: [0, 0, null, 0, 1.1], mode: 'lines', line: { color: 'black', width: 8 }, name: 'xy = 0' }
  ], { ...layout }, { staticPlot: true });

function buildTrace(k) {
    const x = [], y = [];
    for (let xi = 0.01; xi <= 1.1; xi += 0.005) {
      x.push(xi);
      y.push(k / xi);
    }
    return { x, y, mode: 'lines', line: { width: 5 }, name: `xy = ${k}` };
  }

  Plotly.newPlot('plot', [buildTrace(Number(document.getElementById('k-slider').value))], { ...layout }, { staticPlot: true });

  const slider = document.getElementById('k-slider');
  const kValue = document.getElementById('k-value');
  slider.addEventListener('input', function() {
    const k = Number(slider.value);
    kValue.textContent = k.toFixed(4);
    const trace = buildTrace(k);
    Plotly.react('plot', [trace], { ...layout }, { staticPlot: true });
  });
});
</script>
