site_name: Marble
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting_started/installation.md
    - Julia: getting_started/julia.md
    - Python: getting_started/python.md
  # - Constraint Qualification: constraint_qualification.md
  # - Example Problems:
  #   - Contact: example_problems/ex_hopper.md
  #   - Progress Constraints: example_problems/ex_gate_traversal.md
  #   - State-Triggered Constraints: example_problems/ex_rocket_catch.md

  - C++ API: 
    - Overview: api/index.md
    - Solver: api/Solver.md
    - Options: api/Solver/Options.md
    - Problem: api/Problem.md
    - Workspace: api/Workspace.md
    - Filter: api/Filter.md
    - SolveResult: api/SolveResult.md
    - InitialPoint: api/InitialPoint.md

theme:
  name: material
  logo: assets/marble_logo_small.png
  favicon: assets/marble_logo_small.png
extra_css:
  - style.css
markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
        check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list 
  - pymdownx.emoji: 
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
extra:
  social:
    - icon: fontawesome/brands/youtube
      link: TODO
      name: Marble on YouTube
    - icon: fontawesome/brands/github
      link: TODO
      name: Marble on GitHub
    - icon: simple/arxiv
      link: TODO
      name: Marble on arXiv
copyright: "Robotic Exploration Lab (RExLab)"
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.plot.ly/plotly-3.4.0.min.js